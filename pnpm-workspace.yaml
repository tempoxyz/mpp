packages:
  - "workers/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Vocs #670 tests this newly published tokenizer.
  - '@pierre/highlights@0.2.0'
  - mppx
  - viem@2.57.1
  - vocs
  - vite
  - waku
blockExoticSubdeps: true
strictDepBuilds: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
ignoredBuiltDependencies:
  - es5-ext
  - simple-git-hooks
  - vue-demi
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
overrides:
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  # Mermaid's KaTeX range excludes the prototype-pollution hardening release.
  'katex@>=0.11.0 <0.18.2': 0.18.2
  # Miniflare pins sharp 0.35.4, whose prebuilt librsvg is vulnerable.
  'sharp@<0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.28.0 <7.29.1': 7.29.1
  "@babel/core": 7.29.6
  # The latest Scalar json-magic still pins vulnerable undici 7.24.4.
  "@scalar/json-magic>undici": ^7.29.0
  # Vocs still requires remark-mdx-frontmatter 5, which requires vulnerable toml 3.
  "remark-mdx-frontmatter>toml": ^4.2.0

packages:
  - "workers/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - mppx
  - viem@2.57.1
  - vocs@2.12.0
  - vite
  - waku
blockExoticSubdeps: true
strictDepBuilds: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
ignoredBuiltDependencies:
  - core-js
  - es5-ext
  - simple-git-hooks
  - vue-demi
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
overrides:
  # Mermaid's KaTeX range excludes the prototype-pollution hardening release.
  'katex@>=0.11.0 <0.18.2': 0.18.2
  # Miniflare pins sharp 0.35.4, whose prebuilt librsvg is vulnerable.
  'sharp@<0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # Miniflare pins undici 7.28.0, below the 7.30.1 security release.
  'undici@>=7.0.0 <7.30.1': 7.30.1
  "@babel/core": 7.29.6
  # The Scalar json-magic 0.15 that vocs uses pins vulnerable undici 7.24.4.
  "@scalar/json-magic>undici": ^7.30.1
  # Vocs still requires remark-mdx-frontmatter 5, which requires vulnerable toml 3.
  "remark-mdx-frontmatter>toml": ^5.0.1
  # The latest @vercel/cli-config (via @vercel/blob > @vercel/oidc) still pins vulnerable zod 4.1.11.
  "@vercel/cli-config>zod": ^4.6.6

packages:
  - "workers/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - mppx
  - vocs
  - vite
  - waku
blockExoticSubdeps: true
strictDepBuilds: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
ignoredBuiltDependencies:
  - es5-ext
  - simple-git-hooks
  - vue-demi
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
overrides:
  "@babel/core": 7.29.6
  # The latest Scalar json-magic still pins vulnerable undici 7.24.4.
  "@scalar/json-magic>undici": ^7.29.0
  # Vocs still requires remark-mdx-frontmatter 5, which requires vulnerable toml 3.
  "remark-mdx-frontmatter>toml": ^4.2.0

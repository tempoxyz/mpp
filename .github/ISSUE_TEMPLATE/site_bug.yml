name: Site bug
description: Report something broken on mpp.dev, such as a page, component, or link.
labels: ['bug']
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: input
    attributes:
      label: Page
      description: The mpp.dev URL where it happens.
      placeholder: https://mpp.dev/...
    validations:
      required: true

  - type: input
    attributes:
      label: Browser and OS
    validations:
      required: false

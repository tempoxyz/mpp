name: Deploy MPP Discovery Service MCP

# Deploys the mpp-services-mcp Worker to tempo-prd through the Cloudflare Deploy Broker. No job
# holds a Cloudflare credential.
on:
  push:
    branches: [main]
    paths:
      - "workers/mcp-services/**"
      - "src/lib/worker-metrics*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mcp-services-deploy.yml"
  workflow_dispatch:

# One run at a time, in push order, never cancelled: the broker finishes work a cancelled job
# started, so overlapping runs could deploy out of order. GitHub keeps only the newest pending run
# in the group, so main's latest commit always deploys last.
concurrency:
  group: mcp-services-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Secure runner fetches its StepSecurity policy-store credential with OIDC.
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
      - run: pnpm mcp-services:check

  # Builds and attests the Worker and its Wrangler config without any Cloudflare credential. The
  # deploy job hands the artifact to the Cloudflare Deploy Broker, whose mpp-services-mcp
  # authorization admits only this workflow on main, in the Production environment.
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    needs: check
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cloudflare-deploy-broker-build.yml@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
    with:
      install-directory: .
      working-directory: workers/mcp-services
      wrangler-config: wrangler.jsonc
      artifact-name: mpp-services-mcp

  deploy:
    name: mpp-services-mcp
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Spelled as the repository's environment is named: the OIDC subject carries the environment
    # name, and the broker's policy matches the subject exactly.
    environment:
      name: Production
      url: https://mpp.dev/mcp/services
    timeout-minutes: 15
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66

      # The Worker keeps its KV namespace and cron triggers. It has no secrets; vars come from
      # wrangler.jsonc.
      - name: Deploy through the broker
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          deployment-id: mpp-services-mcp
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          archive-digest: ${{ needs.build.outputs.archive-digest }}
          module-digest: ${{ needs.build.outputs.module-digest }}

      - name: Check the MCP server responds
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 --retry 6 --retry-delay 5 --retry-all-errors \
            https://mpp-services-mcp.porto.workers.dev/mcp/services)"
          test "$status" = 200 || { echo "GET /mcp/services returned $status"; exit 1; }

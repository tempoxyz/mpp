name: SDK Manifest Drift Check

on:
  schedule:
    # Run daily at 9am UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      sdk_package:
        description: "SDK package to check"
        required: false
        default: "mppx"
      sdk_version:
        description: "SDK version to check"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@6f436eb3a168279692739e8c0c9fdb52b94bfae7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Run SDK drift check
        id: drift-check
        uses: ./.github/actions/sdk-drift-check
        with:
          sdk-package: ${{ github.event.inputs.sdk_package || 'mppx' }}
          sdk-version: ${{ github.event.inputs.sdk_version || 'latest' }}
          output-dir: ./drift-results

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-check-results-${{ github.run_id }}
          path: drift-results/
          retention-days: 30

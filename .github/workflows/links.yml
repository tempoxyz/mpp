name: External Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly link-rot check, independent of code changes.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee
        uses: tempoxyz/gh-actions/vendor/lycheeverse/lychee-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          # README.md is a GitHub-only artifact with pre-existing
          # broken references (LICENSE files, lockup paths); excluded
          # from this check. Docs site content lives in src/pages/.
          args: >-
            --root-dir ${{ github.workspace }}
            'src/pages/**/*.{md,mdx}'
            'vocs.config.ts'
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken external links detected" --body-file lychee/out.md --label docs --label links

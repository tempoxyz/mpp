name: Service PR Guide

on:
  # This job posts a static comment and never checks out or executes pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]
    paths:
      - "schemas/services.ts"

permissions: {}

jobs:
  comment:
    name: Post contributor guidance
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = [
              'Thanks for submitting a service to the MPP directory!',
              '',
              'Complete the [service pull request template](https://github.com/tempoxyz/mpp/blob/main/.github/PULL_REQUEST_TEMPLATE/service.md) in your PR description before review. It contains the current submission requirements and review criteria.',
              '',
              '[Service submission guide](https://mpp.dev/services#list-your-service)',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

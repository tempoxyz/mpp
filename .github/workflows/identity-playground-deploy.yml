name: Deploy MPP identity playground

on:
  push:
    branches: [main]
    paths:
      - "workers/identity-playground/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/identity-playground-deploy.yml"
  workflow_dispatch:

concurrency:
  group: identity-playground-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    name: mpp-identity-playground
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
      - run: pnpm identity-playground:check
      - name: Check Cloudflare deploy environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID GitHub Environment variable is required"
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN GitHub Environment secret is required"
            exit 1
          }
      - name: Deploy Worker
        run: pnpm identity-playground:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The payee and issuer key: generated once with Foundry and stored only as a Worker secret.
      # Later deploys keep it, so attestations and the payee address stay stable.
      - name: Set MPP_PRIVATE_KEY if missing
        working-directory: workers/identity-playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Any failure to read the list stops here: only a confirmed absence creates a key.
          secrets="$(pnpm exec wrangler secret list --format json)"
          set="$(jq -r 'if type == "array" then any(.[]; .name == "MPP_PRIVATE_KEY") else error("unexpected output") end' <<< "$secrets")"
          if [ "$set" = "true" ]; then
            echo "MPP_PRIVATE_KEY is already set"
            exit 0
          fi
          # Foundry's pinned image, as mppx's CI uses it: the org's Actions allowlist refuses foundry-toolchain.
          key="$(docker run --rm --entrypoint cast ghcr.io/foundry-rs/foundry@sha256:ede4c35d3e9310f6c77f09952cd666e17e4ee7cd5228290d8b4fc9d5cdd37eb1 wallet new --json | jq -r '[.. | .private_key? // empty][0]')"
          echo "::add-mask::$key"
          # Stop unless cast printed a private key: a renamed field would store "null".
          grep -Eqx "0x[0-9a-fA-F]{64}" <<< "$key"
          printf '%s' "$key" | pnpm exec wrangler secret put MPP_PRIVATE_KEY
          echo "Set MPP_PRIVATE_KEY on the Worker"

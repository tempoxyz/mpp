name: Deploy MPP identity playground

on:
  push:
    branches: [main]
    paths:
      - "workers/identity-playground/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/identity-playground-deploy.yml"
  workflow_dispatch:

concurrency:
  group: identity-playground-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_ENV: production
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    name: mpp-identity-playground
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
      - run: pnpm identity-playground:check
      - name: Check Cloudflare deploy environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID GitHub Environment variable is required"
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN GitHub Environment secret is required"
            exit 1
          }
      - name: Deploy Worker
        run: pnpm identity-playground:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The payee and issuer key: generated once with Foundry and stored only as a Worker secret.
      # Later deploys keep it, so attestations and the payee address stay stable.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Set MPP_PRIVATE_KEY if missing
        working-directory: workers/identity-playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if pnpm exec wrangler secret list --format json | jq -e 'any(.[]; .name == "MPP_PRIVATE_KEY")' > /dev/null; then
            echo "MPP_PRIVATE_KEY is already set"
            exit 0
          fi
          key="$(cast wallet new --json | jq -r '[.. | .private_key? // empty][0]')"
          echo "::add-mask::$key"
          test -n "$key"
          printf '%s' "$key" | pnpm exec wrangler secret put MPP_PRIVATE_KEY
          echo "Set MPP_PRIVATE_KEY on the Worker"
